name: build and test

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
        shared: [false, true]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test -Doptimize=ReleaseFast -Dshared=${{ matrix.shared }} --summary all
      - run: zig fmt --check build.zig build.zig.zon build

  cross-windows:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86-windows-gnu, x86_64-windows-gnu, aarch64-windows-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast --summary all

  cross-codegen:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86-linux-gnu, x86_64-linux-gnu, arm-linux-gnueabihf, aarch64-linux-gnu, riscv64-linux-gnu, x86_64-macos, aarch64-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtcc-target=${{ matrix.target }} -Druntime=false -Doptimize=ReleaseFast --summary all
      - run: zig-out/bin/tcc -I. -Iinclude -c examples/ex3.c -o zig-out/ex3.o
